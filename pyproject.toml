[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-ats-docx-gen"
version = "0.1.0"
description = "ATS-friendly resume generator from JSON to DOCX"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "python-docx>=0.8.11",
    "click>=8.0.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
]

[project.scripts]
resume-gen = "resume_gen.cli:main"
resume-mcp = "resume_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
include = ["resume_gen*", "resume_mcp*"]
