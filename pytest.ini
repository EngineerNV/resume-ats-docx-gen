[pytest]
# Pytest configuration for resume-ats-docx-gen

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers
markers =
    integration: Integration tests (may be slow, requires external services)
    api: API tests (requires FastAPI server)
    agents: Agent workflow tests (requires OpenAI API key)
    mcp: MCP server tests
    slow: Slow-running tests

# Coverage options (if using pytest-cov)
# addopts = --cov=app_agents --cov=api --cov=resume_gen --cov-report=html

# Timeout for tests (if using pytest-timeout)
# timeout = 300

# Ignore paths
norecursedirs = 
    .git
    .venv
    venv
    __pycache__
    *.egg-info
    node_modules
    frontend
    outbox
    resume_ats_docx_gen.egg-info

# Log output
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Environment
env =
    PYTHONDONTWRITEBYTECODE=1
